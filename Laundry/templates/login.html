<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Laundry</title>
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <div class="back-login">
        <form class="login" method="POST" action="/login">
            <div class="login-header">
                <h2>MY LAUNDRY</h2>
                <p>Silakan masuk ke akun administrator Anda</p>
            </div>

            <!-- USERNAME -->
            <div class="form-log">
                <label for="username">Username</label>
                <input type="text" name="username_user" id="username" placeholder="Masukkan username" required>
            </div>

            <!-- PASSWORD -->
            <div class="form-log">
                <label for="password">Kata Sandi</label>
                <input type="password" name="password_user" id="password" placeholder="••••••••" required>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="button-log-container">
                <button class="log-button" type="submit">Login</button>
            </div>

            <!-- LINK REGISTER & TESTING -->
            <div class="login-footer">
                <a href="register.html" class="register-text">Belum punya akun? <strong>Register</strong></a>
                <a href="index.html" class="testing-link">← Lewati ke Testing Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
