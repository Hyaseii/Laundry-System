<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="back-login">
        <form class="login" method="POST" action="/login">
            <h2 class="h2-log">LOGIN</h2>
            <div class="form-log">
            <!-- Username -->
                <input type="text" name="username_user" id="" placeholder="Username">
            </div>
            <!-- Password -->
            <div class="form-log">
                <input type="password" name="password_user" id="" placeholder="Password">
            </div>
            <!-- SUBMIT -->
            <div class="button-log">
                <button class="log-button" type="submit">Login</button>
            </div>

            <!-- Link Regis-->
            <a href="register.html" class="register-text">Belum Punya akun? Register</a>
            
            <hr>
        </form>
    </div>
</body>
</html>
