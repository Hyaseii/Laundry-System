<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - My Laundry</title>
    <link rel="stylesheet" href="../static/css/register.css">
</head>
<body>
    <div class="back-register">
        <form class="register" method="POST" action="/register">
            <div class="register-header">
                <h2>MY LAUNDRY</h2>
                <p>Buat akun baru untuk mulai menggunakan layanan</p>
            </div>

            <!-- USERNAME -->
            <div class="form-reg">
                <label for="username">Username</label>
                <input type="text" name="username_user" id="username" placeholder="Masukkan username" required>
            </div>

            <!-- PASSWORD -->
            <div class="form-reg">
                <label for="password">Kata Sandi</label>
                <input type="password" name="password_user" id="password" placeholder="••••••••" required>
            </div>

            <!-- EMAIL -->
            <div class="form-reg">
                <label for="email">Email</label>
                <input type="email" name="email_user" id="email" placeholder="nama@email.com" required>
            </div>

            <!-- NO TELP -->
            <div class="form-reg">
                <label for="phone">No. WhatsApp / Telepon</label>
                <input type="text" name="no_telp" id="phone" placeholder="0856xxxxxxxx" required>
            </div>

            <!-- ALAMAT -->
            <!-- <div class="form-reg">
                <label for="address">Alamat Lengkap</label>
                <input type="text" name="alamat_user" id="address" placeholder="Contoh: Jl. Kenanga No. 149" required>
            </div> -->

            <!-- SUBMIT BUTTON -->
            <div class="button-reg-container">
                <button type="submit" class="log-button">Daftar Sekarang</button>
            </div>

            <!-- LINK LOGIN & TESTING -->
            <div class="register-footer">
                <a href="login.html" class="login-text">Sudah punya akun? <strong>Login di sini</strong></a>
                <a href="index.html" class="testing-link">← Lewati ke Testing Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
