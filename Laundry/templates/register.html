<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="back-register">
        <form class="register" method="POST" action="/register">
            <h2 class="h2-reg">REGISTER</h2>
            <!-- USERNAME -->
            <div class="form-reg">
                <input type="text" name="username_user" id="" placeholder="Username">
            </div>
            <!-- PASSWORD -->
            <div class="form-reg">
                <input type="password" name="password_user" id="" placeholder="Password">
            <br>
            </div>
            <!-- Email -->
            <div class="form-reg">
                <input type="email" name="email_user" placeholder="Email">
            <br>
            </div>
            <!-- No Telp -->
            <div class="form-reg">
                <input type="text" name="no_telp" id="" placeholder="Phone">
            <br>
            </div>
            <!-- Alamat -->
            <div class="form-reg">
                <input type="text" name="alamat_user" placeholder="Address">
            <br>
            </div>
            <!-- SUBMIT BUTTON -->
            <button type="submit" class="log-button">Register</button>
            <a href="login.html" class="login-text">Sudah Punya Akun?Login</a>
            <br>
            <a href="index.html ">Testing</a>
            <hr>
        </form>
    </div>
    <br>
    
</body>
</html>
